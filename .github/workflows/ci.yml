name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Test
        run: pytest -q

  results-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned results environment
        run: |
          pip install -r requirements-results.txt
          pip install -e . --no-deps
      - name: Regenerate demo results and README table
        run: |
          python -m raterkit.cli demo --out results
          python -m raterkit.cli inject-readme README.md --results results
      - name: Fail if committed results drift
        run: git diff --exit-code -- results/report.md results/table.md results/demo.json README.md
